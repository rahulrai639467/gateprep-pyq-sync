name: GatePrep official-source monitor

on:
  schedule:
    # 07:47 IST on Monday and Thursday (GitHub cron uses UTC).
    - cron: '17 2 * * 1,4'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sources.json'
      - 'requirements.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/gatepyq-source-sync.yml'

permissions:
  contents: write

concurrency:
  group: gatepyq-source-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Check official GATE CS source links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run source-monitor tests
        run: python -m unittest discover -s tests -v

      - name: Scan official index pages
        run: python scripts/sync_official_sources.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Explain partial source failures
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/sync-report.json').read_text(encoding='utf-8'))
          if report['overall_status'] != 'ok':
              print('::warning::At least one official source page could not be checked. See data/sync-report.json.')
          print('Source monitor status:', report['overall_status'])
          print('Candidates found:', report['totals']['candidate_documents'])
          print('New/changed/removed:', report['totals']['new_documents'], report['totals']['changed_documents'], report['totals']['removed_documents'])
          PY

      - name: Commit updated source metadata
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-index.json data/sync-report.json
          if git diff --cached --quiet; then
            echo 'No source metadata changes to commit.'
          else
            git commit -m 'chore: refresh official GATE source index'
            git push
          fi

      - name: Upload source index and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateprep-source-monitor-${{ github.run_number }}
          path: |
            data/source-index.json
            data/sync-report.json
          if-no-files-found: warn
          retention-days: 30
