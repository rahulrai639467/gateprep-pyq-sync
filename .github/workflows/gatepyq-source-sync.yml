name: GatePrep official-source monitor

on:
  schedule:
    # 07:47 IST on Monday and Thursday (GitHub cron uses UTC).
    - cron: '17 2 * * 1,4'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sources.json'
      - 'requirements.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/gatepyq-source-sync.yml'

permissions:
  contents: write

concurrency:
  group: gatepyq-source-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Scan GATE CS sources and candidate questions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run source and extractor unit tests
        run: python -m unittest discover -s tests -v

      - name: Scan official index pages
        run: python scripts/sync_official_sources.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Extract candidates from paired official CS paper/key PDFs
        run: python scripts/extract_cs_questions.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Print source and extraction summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('data/sync-report.json').read_text(encoding='utf-8'))
          extraction = json.loads(Path('data/extraction-report.json').read_text(encoding='utf-8'))
          if source['overall_status'] != 'ok':
              print('::warning::At least one official source page could not be checked.')
          if extraction['status'] != 'ok':
              print('::warning::Question extraction is partial; inspect data/extraction-report.json.')
          print('Source scan:', source['overall_status'], source['totals'])
          print('Extraction:', extraction['status'], extraction['candidate_count'], 'candidate records')
          print('Pairs attempted:', extraction['pairs_attempted'])
          print('Extraction warnings:', extraction['questions_with_extraction_warnings'])
          PY

      - name: Commit source index and pending review queue
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-index.json data/sync-report.json data/extraction-queue.json data/extraction-report.json
          if git diff --cached --quiet; then
            echo 'No source or candidate changes.'
          else
            git commit -m 'chore: refresh official sources and question candidates'
            git pull --rebase origin main
            git push
          fi

      - name: Upload source and extraction reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateprep-source-monitor-${{ github.run_number }}
          path: |
            data/source-index.json
            data/sync-report.json
            data/extraction-queue.json
            data/extraction-report.json
          if-no-files-found: warn
          retention-days: 30
